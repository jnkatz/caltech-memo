title: Caltech Memo
author: Jonathan N. Katz
version: 0.1.0
quarto-required: ">=1.4.0"
contributes:
  formats:
    common:
      date-format: "MMMM D, YYYY"
      filters:
        - logo-path.lua
    pdf:
      pdf-engine: xelatex
      fontsize: 11pt
      geometry:
        - margin=1in
        - top=1.05in
        # room for the page-2+ continuation header (fancyhdr warns otherwise)
        - headheight=15pt
      colorlinks: false
      include-in-header:
        - header.tex
      template-partials:
        - partials/title.tex
        - partials/before-body.tex
    typst:
      fontsize: 11pt
      # page numbers come from the continuation header (page 2+), as in the
      # LaTeX format — suppress Quarto's default centered footer number
      page-numbering: false
      font-paths:
        - /_extensions/caltech-memo/fonts
      template-partials:
        - typst-template.typ
        - typst-show.typ
